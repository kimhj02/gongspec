# 기본 실행은 MySQL을 사용한다. 테스트용 H2 설정은 src/test/resources/application.yml에 있다.
server:
  port: 8080

spring:
  application:
    name: gongspec
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/gongspec?characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
    username: ${MYSQL_USER:gongspec}
    password: ${MYSQL_PASSWORD:gongspec}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:13001/auth/kakao/callback}

jwt:
  secret: ${JWT_SECRET:gongspec-local-dev-jwt-secret-key-32b}
  expire: ${JWT_EXPIRE:7d}

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:13001,http://127.0.0.1:13001,http://localhost:3000,http://127.0.0.1:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
  admin:
    kakao-ids: ${APP_ADMIN_KAKAO_IDS:}

# 서울 시간 기준 공고 수집 주기. 실제 실행 전 인증키와 enabled 값도 확인한다.
alio:
  service-key: ${ALIO_SERVICE_KEY:}
  base-url: https://opendata.alio.go.kr
  sync:
    enabled: true
    cron: "0 10 8,16 * * *"
    zone: Asia/Seoul

logging:
  level:
    org.hibernate.SQL: debug
