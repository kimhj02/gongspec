server:
  port: 8080

spring:
  application:
    name: gongspec
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/gongspec?characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
    username: ${MYSQL_USER:gongspec}
    password: ${MYSQL_PASSWORD:gongspec}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:13001/auth/kakao/callback}

jwt:
  secret: ${JWT_SECRET:gongspec-local-dev-jwt-secret-key-32b}
  expire: ${JWT_EXPIRE:7d}

app:
  cors:
    origins: ${CORS_ORIGINS:http://localhost:13001,http://127.0.0.1:13001,http://localhost:3000,http://127.0.0.1:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}

logging:
  level:
    org.hibernate.SQL: debug
