services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: gongspec
      MYSQL_USER: gongspec
      MYSQL_PASSWORD: gongspec
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - gongspec-mysql:/var/lib/mysql

volumes:
  gongspec-mysql:
