# 맥 미니 self-hosted runner에서 Docker 스택을 다시 빌드합니다.
#
# 사전 조건 (맥 미니):
# - GitHub Actions self-hosted runner 라벨: self-hosted, macOS, gongspec
# - /Users/snowrabbit123/Desktop/gongspec 에 clone과 .env가 있음
# - Docker Desktop이 실행 가능
#
# .env는 gitignore라 pull/reset 해도 유지됩니다.

name: Deploy Mac Mini

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-macmini-gongspec
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, gongspec]
    timeout-minutes: 60
    env:
      DEPLOY_PATH: /Users/snowrabbit123/Desktop/gongspec
      PATH: /usr/local/bin:/opt/homebrew/bin:/Applications/Docker.app/Contents/Resources/bin:/Users/snowrabbit123/.local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Wait for Docker
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if docker info >/dev/null 2>&1; then
              echo "Docker ready"
              exit 0
            fi
            if [[ $i -eq 1 ]]; then
              open -a Docker || true
            fi
            sleep 5
          done
          echo "::error::Docker engine not ready"
          exit 1

      - name: Sync repository
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -d .git
          git remote get-url origin
          git fetch --prune origin main
          git checkout main
          git reset --hard origin/main
          echo "HEAD=$(git rev-parse --short HEAD)"

      - name: Verify env file
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f .env || { echo "::error::.env missing"; exit 1; }

      - name: Rebuild stack
        run: |
          set -euo pipefail
          HELPER="${HOME}/.local/bin/docker-credential-medicheck-noop"
          mkdir -p "${HOME}/.local/bin"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  get)  printf '\''%s\n'\'' '\''{"ServerURL":"","Username":"","Secret":""}'\'' ;;' \
            '  list) printf '\''%s\n'\'' '\''{}'\'' ;;' \
            '  store|erase) ;;' \
            '  *) exit 0 ;;' \
            'esac' > "$HELPER"
          chmod +x "$HELPER"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path.home() / ".docker" / "config.json"
          cfg = json.loads(p.read_text()) if p.exists() else {}
          cfg["credsStore"] = "medicheck-noop"
          cfg.pop("credHelpers", None)
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(cfg, indent="\t") + "\n")
          print("docker credsStore=medicheck-noop")
          PY
          cd "$DEPLOY_PATH"
          docker compose --env-file .env up -d --build --remove-orphans

      - name: Health check
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          for i in $(seq 1 36); do
            if docker compose exec -T backend wget -qO- http://127.0.0.1:8080/api/health | grep -q ok; then
              echo "backend health OK"
              break
            fi
            sleep 5
            if [[ $i -eq 36 ]]; then
              echo "::error::backend health check failed"
              exit 1
            fi
          done
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null http://127.0.0.1:13001/; then
              echo "frontend :13001 OK"
              break
            fi
            sleep 5
            if [[ $i -eq 24 ]]; then
              echo "::error::frontend health check failed"
              exit 1
            fi
          done
          curl -fsS -o /dev/null -w "https:%{http_code}\n" https://gongspec.cloud/ || true
