# 맥 미니 self-hosted runner에서 Docker 스택을 다시 빌드합니다.
#
# 사전 조건 (맥 미니):
# - GitHub Actions self-hosted runner 라벨: self-hosted, macOS, gongspec
# - /Users/snowrabbit123/Desktop/gongspec/.env 가 있음 (코드는 runner workspace에서 받음)
# - Docker Desktop이 실행 가능
#
# .env는 gitignore라 checkout 해도 유지됩니다.

name: Deploy Mac Mini

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-macmini-gongspec
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS, gongspec]
    timeout-minutes: 60
    env:
      ENV_FILE: /Users/snowrabbit123/Desktop/gongspec/.env
      COMPOSE_PROJECT_NAME: gongspec
      PATH: /usr/local/bin:/opt/homebrew/bin:/Applications/Docker.app/Contents/Resources/bin:/Users/snowrabbit123/.local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Wait for Docker
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if docker info >/dev/null 2>&1; then
              echo "Docker ready"
              exit 0
            fi
            if [[ $i -eq 1 ]]; then
              open -a Docker || true
            fi
            sleep 5
          done
          echo "::error::Docker engine not ready"
          exit 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Verify env file
        run: |
          set -euo pipefail
          test -f "$ENV_FILE" || { echo "::error::.env missing at $ENV_FILE"; exit 1; }
          cp "$ENV_FILE" .env

      - name: Rebuild stack
        run: |
          set -euo pipefail
          DOCKER_CONFIG_DIR="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG_DIR"' EXIT
          HELPER="$DOCKER_CONFIG_DIR/docker-credential-medicheck-noop"
          printf '%s\n' \
            '#!/bin/sh' \
            'case "$1" in' \
            '  get)  printf '\''%s\n'\'' '\''{"ServerURL":"","Username":"","Secret":""}'\'' ;;' \
            '  list) printf '\''%s\n'\'' '\''{}'\'' ;;' \
            '  store|erase) ;;' \
            '  *) exit 0 ;;' \
            'esac' > "$HELPER"
          chmod +x "$HELPER"
          printf '%s\n' '{"credsStore":"medicheck-noop"}' > "$DOCKER_CONFIG_DIR/config.json"
          export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
          export PATH="$DOCKER_CONFIG_DIR:$PATH"
          docker compose --env-file .env up -d --build --remove-orphans

      - name: Health check
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            if docker compose exec -T backend wget -qO- http://127.0.0.1:8080/api/health | grep -q ok; then
              echo "backend health OK"
              break
            fi
            sleep 5
            if [[ $i -eq 36 ]]; then
              echo "::error::backend health check failed"
              exit 1
            fi
          done
          for i in $(seq 1 24); do
            if curl -fsS -o /dev/null http://127.0.0.1:13001/; then
              echo "frontend :13001 OK"
              break
            fi
            sleep 5
            if [[ $i -eq 24 ]]; then
              echo "::error::frontend health check failed"
              exit 1
            fi
          done
          for i in $(seq 1 24); do
            if code=$(curl -fsS -o /dev/null -w "%{http_code}" https://gongspec.cloud/); then
              echo "https://gongspec.cloud ${code}"
              break
            fi
            sleep 5
            if [[ $i -eq 24 ]]; then
              echo "::error::https://gongspec.cloud health check failed"
              exit 1
            fi
          done
